# Same pattern as qc.ecinc.us. Replace the domain if ReviewMe lands somewhere else.
<VirtualHost *:443>
    ServerName reviewme.ecinc.us
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/reviewme.ecinc.us/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/reviewme.ecinc.us/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/reviewme-error.log
    CustomLog ${APACHE_LOG_DIR}/reviewme-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName reviewme.ecinc.us
    Redirect permanent / https://reviewme.ecinc.us/
</VirtualHost>
